name: iOS Interactive Debug Session

# On-demand, manually-triggered only (never on push/PR): opens a live SSH shell on a real
# GitHub-hosted macOS runner via tmate, free on this public repo. Exists because §18f/§18j's iOS
# native work (CocoaPods/SPM Firebase framework linking, Xcode project setup) needs a real Mac and
# this project has no budget for a rented one — see GOALS.md. The session is terminal-only (no
# Xcode GUI) but that's sufficient for CocoaPods/build-config work, which is what's actually
# blocked. Capped at 45 minutes so it can't burn the free macOS-runner quota indefinitely; re-run
# this workflow again for another session once it closes.
on:
  workflow_dispatch:

jobs:
  interactive-shell:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show available toolchain versions
        run: |
          xcodebuild -version
          pod --version || echo "CocoaPods not found"
          xcrun simctl list runtimes

      - name: Open interactive SSH session (tmate)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 45
