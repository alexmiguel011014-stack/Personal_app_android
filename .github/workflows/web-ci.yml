name: Web CI

# /scanproject 2026-09-14: the js target had no CI gate — web-deploy.yml only runs on push to
# main/feature/kmp-web (it's a deploy, not a check), so a PR could break the web build without
# anything going red. This mirrors android-ci.yml/ios-ci.yml's shape for the js target.
#
# Compile only, deliberately. `:shared:jsTest` is blocked on this repo's centralized-repositories
# setting the same way §19f's Node download was (kotlinNodeJsSetup's test path registers
# https://nodejs.org/dist itself, which FAIL_ON_PROJECT_REPOS rejects, ignoring
# NodeJsEnvSpec.download=false) — confirmed by running it locally, not assumed. Tracked in
# GOALS.md §19h. compileKotlinJs needs no Node/npm at all, so it's safe here.
on:
  push:
    branches: [main, feature/kmp-web]
  pull_request:
    branches: [main, feature/kmp-web]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :app is configured as part of the same Gradle build even though this task never touches
      # it — same secret android-ci.yml already uses.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Compile web target
        run: ./gradlew :shared:compileKotlinJs --no-configuration-cache
