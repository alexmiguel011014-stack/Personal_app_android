name: iOS CI

# GOALS.md §18k: builds the Kotlin/Native iOS targets on GitHub's macOS runner, free on this
# public repo. Deliberately separate from android-ci.yml — this job is expected to be flaky
# while the KMP migration (§18) is in progress, and shouldn't block the working Android CI.
on:
  push:
    branches: [main, feature/kmp-ios]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS targets
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64

      # GOALS.md §18f: disabled since the GitLive Firebase migration — commonTest now links a
      # runnable iOS test binary that transitively pulls in dev.gitlive's Firebase code, and that
      # link step needs the real native FirebaseCore/FirebaseAuth/FirebaseFirestore .framework
      # binaries on the linker search path (`ld: framework 'FirebaseCore' not found`). This
      # project has no CocoaPods/SPM iOS Firebase setup yet — that's real work that belongs with
      # the actual iOS app scaffold (§18h+), not squeezed into the Gradle-only KMP repository
      # rewrite. Compile-only verification (above) still catches real Kotlin/Native compile
      # breakage; re-enable this once native Firebase framework linking is wired up.
      # - name: Run shared module tests on iOS simulator
      #   run: ./gradlew :shared:iosSimulatorArm64Test
