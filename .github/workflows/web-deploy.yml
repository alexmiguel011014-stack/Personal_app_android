name: Web Deploy (GitHub Pages)

# GOALS.md §19g: GitHub Pages over Firebase Hosting — ~100GB/month bandwidth on a public repo
# vs Firebase's 360MB/day, and it reuses the GitHub Actions setup §18k already stood up instead
# of adding a vendor. ubuntu-latest, not macos: unlike ios-ci.yml this is a plain JVM/Node build.
on:
  push:
    branches: [main, feature/kmp-web]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a running one (a half-published site is worse than a slow one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle.properties sets kotlin.js.yarn=false and the root build.gradle.kts sets
      # NodeJsEnvSpec.download = false (GOALS.md §19f) — both make the build use the system
      # Node/npm instead of Kotlin's own downloads, which this repo's centralized
      # FAIL_ON_PROJECT_REPOS setting rejects. So the runner's Node has to be a known one.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Not needed by the js target itself (google-services.json is Android-only), but :app is
      # still configured as part of the same build — same secret android-ci.yml already uses.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Produces shared/build/dist/js/productionExecutable/ (index.html + shared.js + skiko wasm).
      # Slow: the webpack production/minification step took ~26 min locally on a cold cache.
      - name: Build web distribution
        run: ./gradlew :shared:jsBrowserDistribution --no-configuration-cache

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shared/build/dist/js/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
