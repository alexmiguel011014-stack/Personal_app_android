name: iOS CI

# GOALS.md §18k: builds the Kotlin/Native iOS targets on GitHub's macOS runner, free on this
# public repo. Deliberately separate from android-ci.yml — this job is expected to be flaky
# while the KMP migration (§18) is in progress, and shouldn't block the working Android CI.
on:
  push:
    branches: [main, feature/kmp-ios]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS targets
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64

      # GOALS.md §18f: re-enabled 2026-09-01 — the CocoaPods integration (see shared/build.gradle.kts's
      # cocoapods {} block) fixed the `ld: framework 'FirebaseCore' not found` link failure that
      # disabled this step. Verified live on a real GitHub-hosted macOS runner via the
      # ios-interactive.yml debug session, not just locally: BUILD SUCCESSFUL, all the way through
      # linkDebugTestIosSimulatorArm64 and the test itself. First run took ~32 minutes (downloading
      # the Kotlin/Native LLVM toolchain + compiling FirebaseAuth/FirebaseFirestore/
      # FirebaseCrashlytics from source via CocoaPods, all one-time costs) — expect it much faster
      # on subsequent runs once Gradle's own cache (already wired via gradle/actions/setup-gradle)
      # has these artifacts.
      - name: Run shared module tests on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      # GOALS.md §18j: builds the minimal iOS app shell (iosApp/) added 2026-09-01 — proves the
      # whole chain (XcodeGen project generation -> CocoaPods -> Xcode build) works end to end on
      # a real macOS runner, not just that :shared's Kotlin/Native framework compiles. Run as a
      # normal CI step (not the interactive ios-interactive.yml debug session) because the
      # interactive SSH-over-tmux channel proved too unreliable for a multi-minute pod install +
      # xcodebuild sequence — this gets the same free macOS runner with reliable logs instead.
      - name: Generate shared.podspec and dummy framework
        run: ./gradlew :shared:podspec :shared:generateDummyFramework --console=plain

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        working-directory: iosApp
        run: pod install

      - name: Build iOS app shell for simulator
        working-directory: iosApp
        run: |
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
