name: iosApp
options:
  bundleIdPrefix: com.example.personalapp
  deploymentTarget:
    iOS: "15.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalapp.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # No paid Apple Developer account yet (GOALS.md §18j) — simulator builds don't need
        # real code signing, so this stays empty/automatic rather than requiring a team ID.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
